services:
  - type: web
    name: repoguide-backend
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false